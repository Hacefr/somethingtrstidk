<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul - Calendar+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toastContainer"></div>

    <div class="main-wrapper">
        <div class="container">
            <div class="header">
                <h2 id="monthDisplay">MONTH YEAR</h2>
                <div class="controls">
                    <button class="nav-btn" onclick="changeMonth(-1)">PREV</button>
                    <button class="nav-btn" onclick="changeMonth(1)">NEXT</button>
                    <button class="theme-toggle" onclick="toggleTheme()">THEME</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3 id="sideDate">DATE DETAILS</h3>
                <button class="close-icon" onclick="closeSidebar()">X</button>
            </div>
            
            <div id="sideContent">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Task title">
                    <textarea id="taskDesc" placeholder="Details..."></textarea>
                    
                    <div class="priority-picker">
                        <label>PRIORITY:</label>
                        <select id="taskPriority">
                            <option value="low">LOW (GREEN)</option>
                            <option value="mid">MID (YELLOW)</option>
                            <option value="high">HIGH (RED)</option>
                        </select>
                    </div>

                    <button class="save-btn" onclick="saveTask()">SAVE TASK</button>
                </div>
                <div class="task-list" id="taskList"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
