<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul - Calendar+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toastContainer"></div>

    <div class="container">
        <div class="header">
            <h2 id="monthDisplay">Month Year</h2>
            <div class="controls">
                <button class="nav-btn" onclick="changeMonth(-1)">PREV</button>
                <button class="nav-btn" onclick="changeMonth(1)">NEXT</button>
                <button class="theme-toggle" onclick="toggleTheme()">THEME</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Right-Hand Sidebar (Details & Management) -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3 id="sideDate">Date Details</h3>
            <button class="close-icon" onclick="closeSidebar()">X</button>
        </div>
        
        <div id="sideContent">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Task title">
                <textarea id="taskDesc" placeholder="Additional details..."></textarea>
                <button class="add-btn" onclick="saveTask()">SAVE TASK</button>
            </div>
            
            <div class="task-list" id="taskList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
