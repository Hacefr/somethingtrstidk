<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul - Calendar+</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
            --accent: #4ef037; /* Your flag green */
            --border: #ddd;
            --day-hover: #f0f0f0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #333;
            --day-hover: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: 0.3s;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 { margin: 0; font-size: 1.2rem; }

        .controls button, .theme-toggle {
            background: var(--day-hover);
            border: none;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .weekday {
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0.6;
            padding-bottom: 10px;
        }

        .day {
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            padding: 5px;
            transition: 0.2s;
        }

        .day:hover { background: var(--day-hover); }

        .day-num { font-weight: bold; font-size: 0.9rem; }

        .today { border: 2px solid var(--accent) !important; }

        /* Flag Styles from your drawing */
        .flag-container {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-end;
        }

        .flag {
            width: 20px;
            height: 8px;
            background: var(--accent);
            clip-path: polygon(100% 0%, 100% 100%, 0% 100%, 15% 50%, 0% 0%);
        }

        .multi-flag {
            background: var(--text);
            color: var(--card-bg);
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 5px;
        }

        .task-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .task-item {
            padding: 5px;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="monthDisplay">Month Year</h2>
        <div class="controls">
            <button onclick="changeMonth(-1)">&#8249;</button>
            <button onclick="changeMonth(1)">&#8250;</button>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <!-- Generated by JS -->
    </div>
</div>

<!-- Event Modal -->
<div class="modal" id="eventModal">
    <div class="modal-content">
        <h3 id="modalDate">Date</h3>
        <div class="task-list" id="taskList"></div>
        <input type="text" id="taskInput" placeholder="Add new task...">
        <button class="theme-toggle" style="width:100%" onclick="saveTask()">Add Task</button>
        <button class="theme-toggle" style="width:100%; margin-top:5px; background:none" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    let currentData = new Date();
    let selectedDateKey = "";
    // Load from LocalStorage or start empty
    let events = JSON.parse(localStorage.getItem("soul_events")) || {};

    function toggleTheme() {
        const doc = document.documentElement;
        const isDark = doc.getAttribute("data-theme") === "dark";
        doc.setAttribute("data-theme", isDark ? "light" : "dark");
        localStorage.setItem("soul_theme", isDark ? "light" : "dark");
    }

    // Load saved theme
    if (localStorage.getItem("soul_theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }

    function render() {
        const grid = document.getElementById("calendarGrid");
        const display = document.getElementById("monthDisplay");
        grid.innerHTML = "";

        const year = currentData.getFullYear();
        const month = currentData.getMonth();
        
        display.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentData);

        // Add Weekday Headers
        ['S','M','T','W','T','F','S'].forEach(d => {
            grid.innerHTML += `<div class="weekday">${d}</div>`;
        });

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        // Padding for previous month
        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

        // Create Days
        for (let i = 1; i <= lastDate; i++) {
            const dateKey = `${year}-${month}-${i}`;
            const isToday = new Date().toDateString() === new Date(year, month, i).toDateString() ? "today" : "";
            const dayEvents = events[dateKey] || [];
            
            let flags = "";
            if (dayEvents.length > 4) {
                flags = `<div class="multi-flag">4+</div>`;
            } else {
                dayEvents.forEach(() => flags += `<div class="flag"></div>`);
            }

            grid.innerHTML += `
                <div class="day ${isToday}" onclick="openModal('${dateKey}')">
                    <span class="day-num">${i}</span>
                    <div class="flag-container">${flags}</div>
                </div>`;
        }
    }

    function changeMonth(diff) {
        currentData.setMonth(currentData.getMonth() + diff);
        render();
    }

    function openModal(key) {
        selectedDateKey = key;
        document.getElementById("modalDate").innerText = key;
        document.getElementById("eventModal").style.display = "flex";
        updateTaskList();
    }

    function closeModal() {
        document.getElementById("eventModal").style.display = "none";
        document.getElementById("taskInput").value = "";
    }

    function updateTaskList() {
        const list = document.getElementById("taskList");
        list.innerHTML = "";
        (events[selectedDateKey] || []).forEach(t => {
            list.innerHTML += `<div class="task-item">${t}</div>`;
        });
    }

    function saveTask() {
        const input = document.getElementById("taskInput");
        if (!input.value) return;

        if (!events[selectedDateKey]) events[selectedDateKey] = [];
        events[selectedDateKey].push(input.value);
        
        localStorage.setItem("soul_events", JSON.stringify(events));
        input.value = "";
        updateTaskList();
        render();
    }

    render();
</script>
</body>
</html>
